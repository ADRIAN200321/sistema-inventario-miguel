spring.application.name=sistema-inventario

# === BASE DE DATOS ===
# En producción (Render): las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD se inyectan vía render.yaml y sobreescriben estos valores.
# En local: usa los valores por defecto de abajo (MySQL localhost).
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_inventario?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# === PUERTO (Render asigna el puerto vía variable PORT) ===
server.port=${PORT:8081}

# Hibernate crea/actualiza tablas automáticamente en producción (update),
# en local se mantiene en "none" por defecto
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.defer-datasource-initialization=true

# Muestra las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usa nombres exactos de tabla/columna
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# === Inicialización SQL (carga data-postgresql.sql en Render) ===
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.platform=${SQL_INIT_PLATFORM:postgresql}